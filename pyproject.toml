[project]
name = "sc-sncell-github"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Xiangyang", email = "georicl@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anndata>=0.13.3.post0",
    "igraph>=1.0.0",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "jupyter>=1.1.1",
    "jupyterlab>=4.6.3",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "scanpy>=1.12.4",
    "scipy>=1.18.1",
    "squidpy>=1.8.3",
]

[project.scripts]
sc-sncell-github = "sc_sncell_github:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
